<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Action Rapids Barranca</title>
    <meta name="author" content="David Bellon Asencio">
    <meta name="description"
      content="Get in touch with Action Rapids Barranca. Find our address, phone numbers, location map, meet our team, or send us a message for your next rafting trip.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/z-raftingbw.png" alt="Action Rapids Barranca Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1>Action Rapids Barranca</h1>
            <p>Av. Panamericana Norte 450</p>
            <p>Barranca, Peru</p>
            <p>+51 987 654 321</p>
            <p>info@actionrapidsbarranca.com</p>
        </section>

        <div class="map-form-container">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3916.898863148113!2d-77.7634!3d-10.7513!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDQ1JzA0LjciUyA3N8KwNDUnNDguMiJX!5e0!3m2!1sen!2spe!4v1610000000000!5m2!1sen!2spe"
                  width="600" height="450" loading="lazy"
                  title="Action Rapids Barranca Location Map">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-item column2">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder"
                      required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-options">
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe
                        me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/dientes_del_diablo.jpg" alt="John Doe - Lead Guide">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/happy.jpg" alt="Jane Smith - Operations Manager">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/extreme.jpg" alt="Alex Johnson - Safety Director">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Action Rapids Barranca - David Bellon Asencio</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Youtube Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
