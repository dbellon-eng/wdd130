<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting Company | Contact Us</title>
    <meta name="description"
      content="Contact the Rafting Company for inquiries, trip reservations, or feedback. Find our location, phone numbers, and meet our team.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Rafting Company Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <!-- Información de la Empresa y Mapa -->
        <section class="company-info">
            <div class="info-details">
                <h2>Get in Touch</h2>
                <p><strong>Address:</strong> 123 White Water Lane, River City, RC 84000</p>
                <p><strong>Phone:</strong> (555) 123-4567 | (555) 987-6543</p>
                <p><strong>Email:</strong> info@raftingcompany.com</p>
            </div>
            <div class="map-container">
                <!-- Mapa de Google sin estilo inline de borde -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.808235284711!2d-111.891047!3d40.7608!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDQ1JzM4LjkiTiAxMTHCsDUzJzI3LjgnVw!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus"
                  width="400" height="300" loading="lazy" title="Company Location Map">
                </iframe>
            </div>
        </section>

        <!-- Perfiles de Empleados -->
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="John Doe - Lead Guide">
                    <figcaption><strong>John Doe</strong><br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Jane Smith - Operations Manager">
                    <figcaption><strong>Jane Smith</strong><br>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Alex Johnson - Safety Director">
                    <figcaption><strong>Alex Johnson</strong><br>Safety Director</figcaption>
                </figure>
            </div>
        </section>

        <!-- Formulario de Contacto -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">

                <div class="form-item">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <!-- Botones de Radio -->
                <fieldset class="radio-group">
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <!-- Checkbox de Suscripción -->
                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe
                        me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 | Rafting Company | Contact Us Activity</p>
    </footer>

</body>

</html>
